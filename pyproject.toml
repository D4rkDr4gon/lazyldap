[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazyldap"
version = "0.1.0"
description = "A terminal LDAP browser: profiles, directory tree, LDAP search, Excel and LDIF export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "D4rkDr4gon" }]
requires-python = ">=3.10"
dependencies = ["textual>=1.0", "ldap3>=2.9"]
keywords = ["ldap", "active-directory", "tui", "textual", "ldap-browser", "edirectory", "openldap"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]

[project.urls]
Homepage = "https://github.com/D4rkDr4gon/lazyldap"
Issues = "https://github.com/D4rkDr4gon/lazyldap/issues"

[project.scripts]
lazyldap = "lazyldap.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lazyldap"]
